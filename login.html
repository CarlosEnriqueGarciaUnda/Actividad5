<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Iniciar Sesión</title>

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- CSS propio -->
    <link rel="stylesheet" href="css/login.css">
</head>

<body>

    <!-- Fondo -->
    <div class="login-page">

        <!-- Tarjeta -->
        <div class="login-card">

            <!-- Encabezado -->
            <div class="login-header">

                <h1>Iniciar Sesión</h1>

                <p>
                    Ingresa tus datos para continuar
                </p>

            </div>


            <!-- Formulario -->
            <form id="formLogin" novalidate>

                <!-- Correo -->
                <div class="campo">

                    <label for="correo">
                        Correo electrónico
                    </label>

                    <input
                        type="email"
                        id="correo"
                        class="form-control"
                        placeholder="usuario@correo.com"
                        autocomplete="email"
                    >

                    <small
                        id="errorCorreo"
                        class="mensaje-error"
                    ></small>

                </div>


                <!-- Contraseña -->
                <div class="campo">

                    <label for="password">
                        Contraseña
                    </label>

                    <input
                        type="password"
                        id="password"
                        class="form-control"
                        placeholder="Ingresa tu contraseña"
                        autocomplete="current-password"
                    >

                    <small
                        id="errorPassword"
                        class="mensaje-error"
                    ></small>

                </div>


                <!-- Mensaje general -->
                <div
                    id="mensajeGeneral"
                    class="mensaje-general"
                ></div>


                <!-- Botón -->
                <button
                    type="submit"
                    class="btn boton-ingresar"
                >
                    Iniciar sesión
                </button>

            </form>

        </div>

    </div>


    <!-- JavaScript -->
    <script src="js/utileria.js"></script>
    <script src="js/login.js"></script>

</body>
</html>
